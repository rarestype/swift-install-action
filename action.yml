name: "Swift install"
description: "Install Swift"
branding:
    icon: award
    color: purple

inputs:
    swift-release:
        description: "the identifier of a Swift release toolchain, such as '6.3-RELEASE', \
            if using automatic parameter configuration"
        required: false
        type: string

    swift-prefix:
        description: "The URL prefix to download the Swift toolchain from, \
            if installing Swift. The string should be a valid directory under \
            download.swift.org, such as 'swift-6.2.4-release/ubuntu2404/swift-6.2.4-RELEASE'"
        required: false
        type: string

    swift-id:
        description: "The Swift toolchain version to install. This should be a full toolchain \
          identifier, including the platform, like 'swift-6.2.4-RELEASE-ubuntu24.04'"
        required: false
        type: string

    swift-overlay:
        description: "On Linux, the tag of a rarestype/swift release, such as \
            'swift-6.4.1-RELEASE-81bd22795', whose compiler and standard library replace \
            the installed toolchain’s. It must be built for the toolchain being installed, \
            and this action must know its checksums"
        required: false
        type: string

runs:
    using: composite
    steps:
        -   name: Select Swift toolchain
            id: parameters
            shell: bash
            env:
                SWIFT_VERSION: ${{ inputs.swift-release }}
                SWIFT_PREFIX: ${{ inputs.swift-prefix }}
                SWIFT_ID: ${{ inputs.swift-id }}
                SWIFT_OVERLAY: ${{ inputs.swift-overlay }}
            run: |
                if [[ -n "$SWIFT_VERSION" ]]; then
                    if [[ -n "$SWIFT_PREFIX" || -n "$SWIFT_ID" ]]; then
                        echo "::error:: Cannot combine 'swift-release' with 'swift-prefix' or 'swift-id'"
                        exit 1
                    fi

                    if [[ "$RUNNER_OS" == "Linux" ]]; then
                        if ! command -v lsb_release &> /dev/null; then
                            echo "::error:: Auto-configuration requires 'lsb_release', which was not found!"
                            exit 1
                        fi

                        UBUNTU_VERSION="ubuntu$(lsb_release -rs)"
                        SWIFT_PLATFORM="${UBUNTU_VERSION}-$(uname -m)"
                        SWIFT_PLATFORM="${SWIFT_PLATFORM%-x86_64}"

                        SWIFT_PREFIX="swift-${SWIFT_VERSION,,}/${SWIFT_PLATFORM//[.]/}/swift-${SWIFT_VERSION}"
                        SWIFT_ID="swift-${SWIFT_VERSION}-${SWIFT_PLATFORM}"

                    elif [[ "$RUNNER_OS" == "macOS" ]]; then
                        # bash 4 not available on macOS
                        SWIFT_BRANCH="swift-$(echo "$SWIFT_VERSION" | tr '[:upper:]' '[:lower:]')"
                        SWIFT_PREFIX="${SWIFT_BRANCH}/xcode/swift-${SWIFT_VERSION}"
                        SWIFT_ID="swift-${SWIFT_VERSION}"
                    else
                        echo "::error:: Auto-configuration not supported for $RUNNER_OS"
                        exit 1
                    fi
                elif [[ -z "$SWIFT_PREFIX" || -z "$SWIFT_ID" ]]; then
                    echo "::error:: You must provide either 'swift-release' or both 'swift-prefix' and 'swift-id'"
                    exit 1
                fi

                echo "swift-prefix=$SWIFT_PREFIX" >> $GITHUB_OUTPUT
                echo "swift-id=$SWIFT_ID" >> $GITHUB_OUTPUT

                if [[ -n "$SWIFT_OVERLAY" ]]; then
                    if [[ "$RUNNER_OS" != "Linux" ]]; then
                        echo "::error:: 'swift-overlay' is only available on Linux"
                        exit 1
                    fi
                    # a release tag is the toolchain’s identifier, followed by a commit hash
                    if [[ "$SWIFT_ID" != "${SWIFT_OVERLAY%-*}-"* ]]; then
                        echo "::error:: '$SWIFT_OVERLAY' was not built for '$SWIFT_ID'"
                        exit 1
                    fi

                    SWIFT_OVERLAY_ARCHITECTURE="$(uname -m)"
                    # the checksums of every release this action can install, from its notes
                    case "${SWIFT_OVERLAY}/${SWIFT_OVERLAY_ARCHITECTURE}" in
                    swift-6.4.1-RELEASE-81bd22795/x86_64)
                        SWIFT_OVERLAY_SHA256='f5f37179a8043c9e4451a7a4b867226e8356b7348eff976239ba5d08aeb8717b'
                        ;;
                    swift-6.4.1-RELEASE-81bd22795/aarch64)
                        SWIFT_OVERLAY_SHA256='2ee97a73978013f72759b1256bec9d85472a378c9cd835203179a21ee13887e5'
                        ;;
                    *)
                        echo "::error:: No checksum for '$SWIFT_OVERLAY' on $SWIFT_OVERLAY_ARCHITECTURE"
                        exit 1
                        ;;
                    esac

                    SWIFT_OVERLAY_URL="https://github.com/rarestype/swift/releases/download/\
                ${SWIFT_OVERLAY}/${SWIFT_OVERLAY%-*}-linux-${SWIFT_OVERLAY_ARCHITECTURE}.tar.gz"

                    echo "swift-overlay-url=$SWIFT_OVERLAY_URL" >> $GITHUB_OUTPUT
                    echo "swift-overlay-sha256=$SWIFT_OVERLAY_SHA256" >> $GITHUB_OUTPUT
                fi

        -   name: Create installation directory
            shell: bash
            run: |
                mkdir ~/swift

        ### Linux-specific steps

        -   name: Cache Swift toolchain (Linux)
            id:   cache_swift_linux
            if: runner.os == 'Linux'
            uses: actions/cache@v5
            with:
                path: "~/swift/swift.tar.gz"
                key: "swift:${{ steps.parameters.outputs.swift-id }}.tar.gz"

        -   name: Download Swift (Linux)
            shell: bash
            if: runner.os == 'Linux' && steps.cache_swift_linux.outputs.cache-hit != 'true'
            env:
                SWIFT_PREFIX: ${{ steps.parameters.outputs.swift-prefix }}
                SWIFT_ID: ${{ steps.parameters.outputs.swift-id }}
            run: |
                curl "https://download.swift.org/${SWIFT_PREFIX}/${SWIFT_ID}.tar.gz" \
                    --output "${HOME}/swift/swift.tar.gz"

        -   name: Install Swift (Linux)
            shell: bash
            if: runner.os == 'Linux'
            env:
                SWIFT_ID: ${{ steps.parameters.outputs.swift-id }}
            run: |
                SWIFT_TOOLCHAIN="${HOME}/swift/${SWIFT_ID}"

                mkdir "$SWIFT_TOOLCHAIN"
                tar -xzf "${HOME}/swift/swift.tar.gz" -C "$SWIFT_TOOLCHAIN" --strip 1

                echo "SWIFT_INSTALLATION=${SWIFT_TOOLCHAIN}/usr" >> "$GITHUB_ENV"
                echo "${SWIFT_TOOLCHAIN}/usr/bin" >> "$GITHUB_PATH"

                # expose Swift's C++ and Block headers for libraries like IndexStoreDB
                echo "CPLUS_INCLUDE_PATH=${CPLUS_INCLUDE_PATH:+${CPLUS_INCLUDE_PATH}:}\
                ${SWIFT_TOOLCHAIN}/usr/lib/swift:\
                ${SWIFT_TOOLCHAIN}/usr/lib/swift/Block" >> "$GITHUB_ENV"

        -   name: Install Swift overlay (Linux)
            shell: bash
            if: runner.os == 'Linux' && inputs.swift-overlay != ''
            env:
                SWIFT_ID: ${{ steps.parameters.outputs.swift-id }}
                SWIFT_OVERLAY_URL: ${{ steps.parameters.outputs.swift-overlay-url }}
                SWIFT_OVERLAY_SHA256: ${{ steps.parameters.outputs.swift-overlay-sha256 }}
            run: |
                # the archive replaces files under the toolchain’s `usr`
                curl -fsSL "$SWIFT_OVERLAY_URL" --output "${HOME}/swift/overlay.tar.gz"
                echo "${SWIFT_OVERLAY_SHA256}  ${HOME}/swift/overlay.tar.gz" | sha256sum -c -
                tar -xzf "${HOME}/swift/overlay.tar.gz" -C "${HOME}/swift/${SWIFT_ID}"
                rm "${HOME}/swift/overlay.tar.gz"

                cat "${HOME}/swift/${SWIFT_ID}/usr/share/swift/rarest-overlay.txt"

        ### macOS-specific steps
        ### Please note, on macOS, the `swift-id` does not include the `-osx` suffix!

        -   name: Cache Swift toolchain (macOS)
            id:   cache_swift_macos
            if: runner.os == 'macOS'
            uses: actions/cache@v5
            with:
                path: "~/swift/swift.pkg"
                key: "swift:${{ steps.parameters.outputs.swift-id }}.pkg"

        -   name: Download Swift (macOS)
            shell: bash
            if: runner.os == 'macOS' && steps.cache_swift_macos.outputs.cache-hit != 'true'
            env:
                SWIFT_PREFIX: ${{ steps.parameters.outputs.swift-prefix }}
                SWIFT_ID: ${{ steps.parameters.outputs.swift-id }}
            run: |
                curl "https://download.swift.org/${SWIFT_PREFIX}/${SWIFT_ID}-osx.pkg" \
                    --output "${HOME}/swift/swift.pkg"

        -   name: Install Swift (macOS)
            shell: bash
            if: runner.os == 'macOS'
            env:
                SWIFT_ID: ${{ steps.parameters.outputs.swift-id }}
            run: |
                sudo installer -pkg "${HOME}/swift/swift.pkg" -target /

                SWIFT_TOOLCHAIN="/Library/Developer/Toolchains/${SWIFT_ID}.xctoolchain"
                SWIFT_BUNDLE_ID=$(\
                    plutil -extract CFBundleIdentifier raw "${SWIFT_TOOLCHAIN}/Info.plist")

                echo "SWIFT_INSTALLATION=${SWIFT_TOOLCHAIN}/usr" >> "$GITHUB_ENV"
                echo "TOOLCHAINS=${SWIFT_BUNDLE_ID}" >> "$GITHUB_ENV"

        ### End platform-specific steps

        -   name: Check Swift
            shell: bash
            run: |
                "${SWIFT_INSTALLATION}/bin/swift" --version
                swift --version
